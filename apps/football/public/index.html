/* ---- state export / import ---- */
function exportState(){ sendAction("stateFull", {}); }
function downloadStateFile(text){
  if(!text){ toast("Nothing to download yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="football-tournament.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Tournament state downloaded.","info");
}
function importStateFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    if(!confirm("Load this tournament file? It replaces the tournament that's currently running.")){
      input.value=""; return;
    }
    sendAction("stateImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}


/* ---- match clock ----
   The server owns the clock; every device counts along from the
   snapshot. Only the admin gets controls — spectators just watch. */
const CLK_MIN = 60000;
function clkFmt(ms){ const s=Math.floor(Math.max(0,ms)/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function clkView(){
  const now = Date.now() + CLOCK_OFF;
  const dur = CLOCK ? CLOCK.dur : (S.duration||90);
  const brk = CLOCK ? CLOCK.brk : (S.breakMins!=null ? S.breakMins : 15);
  const v = {phase:"ready", half:1, el:0, added:0, br:0, hm:dur/2*CLK_MIN, brk};
  if(CLOCK){
    v.phase=CLOCK.phase; v.half=CLOCK.half; v.el=CLOCK.el; v.added=CLOCK.added; v.br=CLOCK.br;
    const dt = Math.max(0, now - CLOCK.ts);
    if(v.phase==="run") v.el = Math.min(v.el + dt, v.hm + v.added*CLK_MIN);
    else if(v.phase==="break") v.br = Math.max(0, v.br - dt);
  }
  return v;
}
function clkText(v){
  const off=(v.half-1)*v.hm, name=v.half===1 ? "First half" : "Second half";
  const over=Math.max(0, v.el - v.hm), limit=v.hm + v.added*CLK_MIN;
  if(v.phase==="break") return {phase:"Halftime break", time:clkFmt(v.br), plus:"", sub:"Second half resumes from "+clkFmt(v.hm)};
  const time=clkFmt(off + Math.min(v.el, v.hm)), plus=over>0 ? "+"+clkFmt(over) : "";
  if(v.phase==="final") return {phase:"Full time", time, plus, sub:"The match is over."};
  if(v.phase==="ready") return {phase:name+" ready", time, plus:"", sub:"Half ends at "+clkFmt(off+v.hm)};
  if(v.phase==="paused") return {phase:"Paused", time, plus, sub:name+" · half ends at "+clkFmt(off+limit)};
  return {phase:over>0 ? name+" · stoppage time" : name, time, plus, sub:"Half ends at "+clkFmt(off+limit)};
}
function clockHTML(){
  const v=clkView(), t=clkText(v), admin=MY_ROLE==="admin";
  const live=v.phase==="run"||v.phase==="paused";
  let controls="";
  if(admin){
    const main = v.phase==="ready" ? ["start", v.half===1 ? "Kick off" : "Start second half"]
      : v.phase==="run" ? ["pause","Pause"] : v.phase==="paused" ? ["resume","Resume"]
      : v.phase==="break" ? ["skip","Skip break"] : null;
    controls = `
      <div class="mclk-row">
        ${main ? `<button class="btn small" onclick="clkAct('${main[0]}')">${main[1]}</button>` : ""}
        ${live ? `<button class="btn small danger" onclick="clkEnd()">End half</button>` : ""}
        ${CLOCK && v.phase!=="ready" || (CLOCK && v.half===2) ? `<button class="btn small secondary" onclick="clkReset()">Reset clock</button>` : ""}
      </div>
      <div class="mclk-cap">Added time for this half</div>
      <div class="mclk-adds">${[-1,1,2,3,4,5].map(d=>`<button class="btn small secondary" ${live?"":"disabled"} onclick="clkAct('add',${d})">${d<0?"−1":"+"+d}</button>`).join("")}</div>`;
  }
  return `<div class="mclk" id="mclk">
    <div class="mclk-top"><span id="mclk-phase">${t.phase}</span><button class="mclk-sound" onclick="clkToggleSound()" id="mclk-snd">${CLK_MUTED?"🔇 Whistle off":"🔊 Whistle on"}</button></div>
    <div class="mclk-time" id="mclk-time">${t.time}${t.plus?`<span class="plus">${t.plus}</span>`:""}</div>
    <div class="mclk-sub" id="mclk-sub">${t.sub}</div>
    <div class="mclk-board${live?"":" off"}" id="mclk-board">Added time <b id="mclk-added">+${v.added}</b></div>
    ${controls}
  </div>`;
}
function clkAct(op, delta){ clkAudio(); sendAction("clock", {op, delta}); }
function clkEnd(){ if(confirm("End this half now?")) clkAct("end"); }
function clkReset(){ if(confirm("Reset the match clock to 00:00?")) clkAct("reset"); }
function clkToggleSound(){
  CLK_MUTED=!CLK_MUTED; clkAudio();
  const b=document.getElementById("mclk-snd"); if(b) b.textContent=CLK_MUTED?"🔇 Whistle off":"🔊 Whistle on";
}
function clkAudio(){
  try{
    if(!CLK_AC) CLK_AC = new (window.AudioContext||window.webkitAudioContext)();
    if(CLK_AC.state==="suspended") CLK_AC.resume();
  }catch(_){}
}
document.addEventListener("pointerdown", clkAudio);
// synthesised referee whistle: two close tones with a fast tremolo
function clkBlow(kind){
  const ac=CLK_AC; if(CLK_MUTED || !ac || ac.state!=="running") return;
  const pat = kind==="start" ? [[0,.8]] : [[0,.4],[.55,.4],[1.1,1]];
  const t0 = ac.currentTime + .05;
  pat.forEach(([s,d])=>{
    const env=ac.createGain(), tr=ac.createGain(), lfo=ac.createOscillator(), lg=ac.createGain();
    env.gain.setValueAtTime(0,t0+s); env.gain.linearRampToValueAtTime(.35,t0+s+.03);
    env.gain.setValueAtTime(.35,t0+s+d-.05); env.gain.linearRampToValueAtTime(0,t0+s+d);
    tr.gain.value=.65; lg.gain.value=.35; lfo.frequency.value=36; lfo.connect(lg); lg.connect(tr.gain);
    [2850,3120].forEach(f=>{ const o=ac.createOscillator(); o.frequency.value=f; o.connect(tr); o.start(t0+s); o.stop(t0+s+d+.05); });
    tr.connect(env); env.connect(ac.destination); lfo.start(t0+s); lfo.stop(t0+s+d+.05);
  });
}
// repaints the numbers a few times a second without rebuilding the page
function clkPaint(){
  const box=document.getElementById("mclk");
  if(!box || !S){ CLK_PREV=null; return; }
  const v=clkView(), t=clkText(v), key=v.phase+v.half;
  const P=CLK_PREV; CLK_PREV=key;
  if(P && P!==key){
    if(/^ready/.test(P) && /^run/.test(key)) clkBlow("start");
    else if((/^(run|paused)/.test(P) && (/^break/.test(key) || key==="final2" || key==="ready2")) || (/^break/.test(P) && key==="ready2")) clkBlow("end");
  }
  const set=(id,txt)=>{ const e=document.getElementById(id); if(e && e.textContent!==txt) e.textContent=txt; };
  set("mclk-phase", t.phase); set("mclk-sub", t.sub); set("mclk-added", "+"+v.added);
  const tm=document.getElementById("mclk-time");
  const html=t.time+(t.plus?`<span class="plus">${t.plus}</span>`:"");
  if(tm && tm.innerHTML!==html) tm.innerHTML=html;
}
setInterval(clkPaint, 250);

/* Network layer — every user action is a message to the server. */

let ws;
function connect(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // a Spectator tab announces itself (?viewer=1) so the server never
  // hands it the admin seat; a token-holding tab re-authenticates instead
  let spectating = false;
  try {
    spectating = localStorage.getItem("ttViewer")==="1" &&
                 !sessionStorage.getItem("fbAdminToken");
  } catch(_) {}
  ws = new WebSocket(proto + "//" + location.host + "/football/" + (spectating ? "?viewer=1" : ""));

  ws.addEventListener("message", (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type==="welcome"){
      MY_ROLE = msg.role;
      S = msg.state;
      SEASON = msg.season || null;
      PLAYERS_DB = Array.isArray(msg.players) ? msg.players : [];
      if(msg.fullSeason) storeBackup(msg.fullSeason);
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      CLOCK = msg.clock || null; CLOCK_OFF = (msg.serverNow || Date.now()) - Date.now();
      LAST_EVENT_FP = null; // don't replay old decisions as toasts
      LAST_SEED = S ? S.seed : null;
      // silent re-login (token lives in sessionStorage, dies with the tab)
      if(AUTH_REQUIRED && MY_ROLE==="guest"){
        let tok=null; try{ tok=sessionStorage.getItem("fbAdminToken"); }catch(_){}
        if(tok){ PENDING_TOKEN=tok; AUTO_LOGIN=true; sendAction("auth", {token: tok}); }
      }
      syncEventToasts();
      render();
    } else if(msg.type==="state"){
      S = msg.state;
      SEASON = msg.season || null;
      if(Array.isArray(msg.players)) PLAYERS_DB = msg.players;
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      if(msg.authRequired!=null) AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      CLOCK = msg.clock || null; CLOCK_OFF = (msg.serverNow || Date.now()) - Date.now();
      if(LAST_SEED!=null && S && S.seed!==LAST_SEED && S.step!=="roster" && !S.suspended){
        toast("Tournament state loaded.","info");
      }
      if(S) LAST_SEED = S.seed;
      syncEventToasts();
      syncImportToast();
      render();
    } else if(msg.type==="authOk"){
      MY_ROLE = "admin";
      if(PENDING_TOKEN){
        try{ sessionStorage.setItem("fbAdminToken", PENDING_TOKEN); localStorage.removeItem("ttViewer"); }catch(_){}
        PENDING_TOKEN = "";
        if(!msg.already && !AUTO_LOGIN) toast("Signed in — you're the admin now.","info");
      }
      AUTO_LOGIN = false;
      render();
    } else if(msg.type==="authFail"){
      PENDING_TOKEN = "";
      AUTO_LOGIN = false;
      try{ sessionStorage.removeItem("fbAdminToken"); }catch(_){}
      toast(msg.message || "That token isn't right.", "error");
      render();
    } else if(msg.type==="error"){
      toast(msg.message, "error");
    } else if(msg.type==="seasonFull"){
      downloadSeasonFile(msg.text);
    } else if(msg.type==="stateFull"){
      downloadStateFile(msg.text);
    } else if(msg.type==="sessionEnded"){
      SESSION_ENDED = true;
      render();
    }
  });

  ws.addEventListener("close", () => {
    if(!SESSION_ENDED){
      S = null;
      render();
      setTimeout(connect, 1500); // simple auto-retry
    }
  });
}
if(!GATED) connect();

function sendAction(type, payload){
  if(ws.readyState!==ws.OPEN) return;
  ws.send(JSON.stringify({type, payload}));
}

/* ---- action senders ---- */

function submitRoster(){
  const rawEl=document.getElementById("directivesInput");
  const raw=rawEl?rawEl.value:"";
  const nameEl=document.getElementById("tnameInput");
  const num=id=>{
    const el=document.getElementById(id);
    const v=el?parseInt(el.value,10):NaN;
    return Number.isFinite(v)?v:null;
  };
  sendAction("submitRoster", {raw, name:nameEl?nameEl.value:null,
    duration:num("durationInput"), breakMins:num("breakInput")});
}
// Sends the full-time / break boxes to the server so they stay put
// through every re-render. Silent unless the admin pressed Save.
function pushTiming(explicit){
  const rd=id=>{ const el=document.getElementById(id); const v=el?parseInt(el.value,10):NaN; return Number.isFinite(v)?v:null; };
  const d=rd("durationInput"), b=rd("breakInput");
  if(d==null && b==null) return;
  const dur=d!=null?d:(S.duration||90), brk=b!=null?b:(S.breakMins!=null?S.breakMins:15);
  if(dur<1||dur>300||brk<0||brk>60){
    if(explicit) toast("Full time is 1 to 300 minutes and the break is 0 to 60.","error");
    return;
  }
  if(dur!==S.duration || brk!==S.breakMins) sendAction("setTiming",{duration:dur, breakMins:brk});
  if(explicit) toast("Saved: "+dur+"' full time + "+brk+"' break.","info");
}
function saveTiming(){ pushTiming(true); }
function addTeam(){
  const v=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const payload={teamName:v("teamNameInput"), captain:v("captainInput"), players:v("playersInput")};
  if(!payload.teamName.trim()){ toast("Enter a team name.","error"); return; }
  if(!payload.captain.trim()){ toast("Enter the captain's name.","error"); return; }
  pushTiming(false);
  sendAction("addTeam", payload);
  ["teamNameInput","captainInput","playersInput"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
}
function removeTeam(index){ pushTiming(false); sendAction("removeTeam", {index}); }
function pickMode(mode){ sendAction("pickMode", {mode}); }
function addForbidden(){
  const x=document.getElementById("fx").value, y=document.getElementById("fy").value;
  sendAction("addForbidden", {x,y});
}
function removeForbidden(i){ sendAction("removeForbidden", {index:i}); }
function formTeams(){ sendAction("formTeams", {}); }
function goToPairing(){ sendAction("goToPairing", {}); }
function confirmTeamsAndDraw(){ sendAction("confirmTeamsAndDraw", {}); }
function saveScore(mi, sa, sb, penA, penB){ sendAction("saveScore", {mi, sa, sb, penA, penB}); }
function continueTournament(){ sendAction("continueTournament", {}); }
function undoLastScore(){ sendAction("undoScore", {}); }
function chooseStageManually(){ sendAction("chooseStage", {}); }
function doReset(){ sendAction("reset", {}); }

/* ---- season actions ---- */

function exportSeason(){ sendAction("seasonFull", {}); }
function downloadSeasonFile(text){
  if(!text){ toast("Nothing to export yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="football-season.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  storeBackup(text);
  toast("Season data downloaded — keep it somewhere safe.","info");
}
function importSeasonFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
    sendAction("seasonImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}
function newSeasonDialog(){
  const name=prompt("Name the new season (leave blank for the default):","");
  if(name===null) return;
  if(!confirm("Start a fresh season? The current archive stays on file until overwritten — export it first if you want to keep a copy.")) return;
  sendAction("seasonNew", {name});
}
function restoreBackup(){
  if(!BACKUP) return;
  IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
  sendAction("seasonImport", {text:BACKUP});
}
function toggleStar(name){ sendAction("seasonStar", {name}); }
function sortSeason(key){
  if(SEASON_SORT.key===key) SEASON_SORT.dir=-SEASON_SORT.dir;
  else SEASON_SORT={key, dir:-1};
  render();
}

if(!GATED) render();
</script>
