/* ---- choice-system interaction (DOM-surgical where it matters) ---- */

function cacheFields(){
  ["advanceN","poolCount","poolQualify"].forEach(id=>{
    const e=document.getElementById(id);
    if(e) FIELD_CACHE[id]=e.value;
  });
}
function setQMode(m){ cacheFields(); QMODE=m; render(); }
function setSeedMode(m){ cacheFields(); SEED_MODE=m; render(); }
function setSplitMode(m){ cacheFields(); SPLIT_MODE=m; render(); }
function toggleSeed(code){
  cacheFields();
  const i=SEED_ORDER.indexOf(code);
  if(i>=0) SEED_ORDER.splice(i,1); else SEED_ORDER.push(code);
  render();
}
function togglePick(code){
  PICKS[code]=!PICKS[code];
  const cell=document.getElementById("pc-"+code);
  if(cell){
    cell.classList.toggle("on", !!PICKS[code]);
    const mark=cell.querySelector(".pc-mark");
    if(mark) mark.innerHTML=PICKS[code]?ic("check",13):"";
  }
  const c=S.stageChoice;
  if(c && c.picker){
    c.picker.groups.forEach((g,gi)=>{
      const cnt=document.getElementById("pc-count-"+gi);
      if(cnt) cnt.textContent=(g.name?("Pool "+g.name+" — "):"")+g.members.filter(m=>PICKS[m]).length+" of "+g.count+" picked";
    });
  }
}

function randomFormat(){
  const c=S.stageChoice;
  if(!c) return;
  cacheFields();
  const n=c.entrants.length;
  const options=["rr","elim"];
  if(n%2===0 && !isPow2(n)) options.push("hybrid");
  if(n>=4) options.push("pools");
  PICKED_FORMAT=options[Math.floor(Math.random()*options.length)];
  if(PICKED_FORMAT==="pools"){
    const pools=Math.max(1, Math.min(4, Math.floor(n/3)));
    const minSize=Math.floor(n/pools);
    const qual=(minSize>2 && Math.random()<0.5)?2:1;
    FIELD_CACHE.poolCount=String(pools);
    FIELD_CACHE.poolQualify=String(qual);
  } else {
    delete FIELD_CACHE.poolCount;
    delete FIELD_CACHE.poolQualify;
  }
  const labels={rr:"Round Robin", elim:"Elimination", hybrid:"Hybrid", pools:"Pools"};
  toast("Format drawn at random: "+(labels[PICKED_FORMAT]||PICKED_FORMAT),"info");
  render();
}

function selectNextFormat(fmt){
  PICKED_FORMAT=fmt;
  // re-render: the per-format panels are conditional, and a class
  // toggle could never reveal them. Typed values survive via
  // FIELD_CACHE; panel state persists via the choice key.
  render();
}

function confirmNextStage(){
  const c=S.stageChoice;
  if(!c) return;
  if(!PICKED_FORMAT){ toast("Pick a format first.","error"); return; }
  if(c.picker && QMODE==="picks"){
    const picks=Object.keys(PICKS).filter(k=>PICKS[k]);
    const required=c.picker.groups.reduce((s,g)=>s+g.count,0);
    if(picks.length!==required){
      toast("Pick exactly "+required+" players to advance — you've chosen "+picks.length+".","error");
      return;
    }
  }
  if(PICKED_FORMAT==="elim" && SEED_MODE==="manual" && QMODE!=="random"){
    const list=(QMODE==="picks")?c.entrants.filter(x=>PICKS[x]):c.entrants;
    if(SEED_ORDER.length!==list.length){
      toast("Set the full seeding order — tap every player once, in order.","error");
      return;
    }
  }
  const advEl=document.getElementById("advanceN");
  const pcEl=document.getElementById("poolCount");
  const pqEl=document.getElementById("poolQualify");
  const num=(el)=>{ if(!el) return null; const v=parseInt(el.value,10); return Number.isFinite(v)?v:null; };
  sendAction("pickStage", {
    format:PICKED_FORMAT,
    advance:(PICKED_FORMAT==="rr"&&advEl)?num(advEl):null,
    poolCount:(PICKED_FORMAT==="pools")?num(pcEl):null,
    poolQualify:(PICKED_FORMAT==="pools")?num(pqEl):null,
    qmode:(c.picker && QMODE!=="auto")?QMODE:null,
    picks:(c.picker && QMODE==="picks")?Object.keys(PICKS).filter(k=>PICKS[k]):null,
    seedMode:(PICKED_FORMAT==="elim")?SEED_MODE:null,
    seedOrder:(PICKED_FORMAT==="elim" && SEED_MODE==="manual" && QMODE!=="random")?SEED_ORDER.slice():null,
    splitMode:(PICKED_FORMAT==="pools")?SPLIT_MODE:null,
    byesMode:(PICKED_FORMAT==="elim" && c.counts && c.counts.elimPlayin)?BYES_MODE:null
  });
}

/* ---- Matches tab: the full indexed draw (v1.7) ---- */

function renderMatchesTab(){
  if(!S || !S.schedule || ["roster","mode","pairing","teamsFormed","toomany"].includes(S.step)){
    return `<h2 class="section">Match index</h2>
      <div class="empty"><span class="big">${ic("clipboard",30)}</span>No draw yet — start a tournament in the <b>Live score</b> tab, then every fixture lands here.</div>`;
  }
  const mx=S.matchIndex||{matches:[],total:0,played:0,annulled:0};
  const admin=MY_ROLE==="admin";
  const byRound=new Map();
  mx.matches.forEach(m=>{
    if(!byRound.has(m.roundIndex)) byRound.set(m.roundIndex, []);
    byRound.get(m.roundIndex).push(m);
  });
  let html=`<h2 class="section">Match index</h2>
    <p class="season-sub">${mx.played} of ${mx.total} played${mx.annulled?(" · "+mx.annulled+" annulled"):""} — play them in whatever order the draw allows.</p>`;
  [...byRound.keys()].forEach(ri=>{
    const list=byRound.get(ri);
    const done=list.filter(m=>m.played&&!m.annulled).length;
    const isNow=(ri===S.roundIndex && S.step==="play");
    const label=list[0]&&list[0].roundLabel||"";
    const badge=(label && label!=="Round "+(ri+1))?`<span class="round-badge">${esc(label)}</span>`:"";
    html+=`<div class="mx-round">
      <span class="rt">Round ${ri+1}</span>
      ${badge}
      <span class="mx-count">${done}/${list.length}</span>
      ${isNow?'<span class="mx-chip live">up now</span>':""}
    </div>`;
    html+=list.map(m=>matchRowHTML(m, admin)).join("");
  });
  if(admin && S.editStack && S.editStack.length){
    html+=`<div style="margin-top:12px"><button class="btn secondary small" onclick="undoEditAction()">${ic("refresh",14)} Undo last correction</button></div>`;
  }
  return html;
}

function matchRowHTML(m, admin){
  const cls=["mx-row"];
  if(m.played && !m.annulled) cls.push("played");
  if(m.annulled) cls.push("void");
  if(m.current) cls.push("current");
  const nameCell=(nm)=>nm?`<span class="mx-team">${esc(nm)}${starHTML(nm)}</span>`:`<span class="mx-team"><span class="tbd">To be decided</span></span>`;
  const statusChip = m.annulled ? `<span class="mx-chip void">annulled</span>`
    : m.forfeit ? `<span class="mx-chip void">w/o</span>`
    : m.bye ? `<span class="mx-chip">bye</span>`
    : m.played ? `<span class="mx-chip done">played</span>`
    : m.tbd ? `<span class="mx-chip">tbd</span>`
    : m.current ? `<span class="mx-chip live">up now</span>`
    : `<span class="mx-chip">to play</span>`;
  const scoreHTML = (m.played && !m.annulled)
    ? `<span class="mx-score">${m.scoreA} – ${m.scoreB}${m.penA!=null?`<span class="mx-pens"> (${m.penA}–${m.penB} pens)</span>`:""}</span>`
    : `<span class="mx-score tbd">vs</span>`;
  let controls="";
  if(admin && !m.annulled && !m.bye && !m.tbd && S.step==="play"){
    if(!m.played){
      controls=`<button class="btn tiny" onclick="openMatchForm('${m.id}','score')">${ic("play",12)} Score</button>`;
    } else if(m.editable){
      controls=`<button class="btn tiny secondary" onclick="openMatchForm('${m.id}','correct')">${ic("sliders",12)} Correct</button>`;
    } else {
      controls=`<span class="mx-locked" title="${esc(m.lockReason||"Locked.")}">locked</span>`;
    }
  }
  const goalLine=(m.played && !m.annulled && m.goals && m.goals.length)
    ? `<div class="mx-goals">${m.goals.map(g=>`<span class="gchip${g.own?" og":""}" title="${esc(g.scorer)} — ${esc(g.teamName||"")}">${g.min}’ ${esc(g.scorer)}${g.own?` ${ic("flag",10)} <span class="og-note">og</span>`:""}</span>`).join("")}</div>`
    : "";
  return `<div class="${cls.join(" ")}" id="mx-${m.id}">
    <div class="mx-main">
      ${nameCell(m.aName)}
      ${scoreHTML}
      ${nameCell(m.bName)}
      ${statusChip}
    </div>
    ${goalLine}
    ${controls?`<div class="mx-ctl">${controls}</div>`:""}
  </div>`;
}

/* ---- goal sheet (v1.8): the match form is a modal — score, pens,
   a running clock, scorer picked from the squad list, own goals and
   per-entry correction. It lives on <body>, so WS re-renders of #app
   never kill a half-filled sheet. ---- */
let GOAL_CLOCK={acc:0, since:null, int:null};   // match clock (client-side)
function clockRunning(){ return GOAL_CLOCK.since!=null; }
function clockMs(){ return GOAL_CLOCK.acc + (GOAL_CLOCK.since!=null?(Date.now()-GOAL_CLOCK.since):0); }
function clockToggle(){
  if(clockRunning()){
    GOAL_CLOCK.acc=clockMs(); GOAL_CLOCK.since=null;
    if(GOAL_CLOCK.int){ clearInterval(GOAL_CLOCK.int); GOAL_CLOCK.int=null; }
  } else {
    GOAL_CLOCK.since=Date.now();
    GOAL_CLOCK.int=setInterval(clockTick, 500);
  }
  paintClockState();
}
function clockReset(){
  GOAL_CLOCK.acc=0; GOAL_CLOCK.since=null;
  if(GOAL_CLOCK.int){ clearInterval(GOAL_CLOCK.int); GOAL_CLOCK.int=null; }
  paintClockState();
  const min=document.getElementById("g-min");
  if(min){ min.value=""; delete min.dataset.auto; }
}
function clockStop(){ if(clockRunning()) clockToggle(); }
function clockTick(){
  const el=document.getElementById("g-clock");
  if(el) el.textContent=clockText();
  const min=document.getElementById("g-min");
  if(min && min.dataset.auto==="1"){
    const m=Math.max(1, Math.ceil(clockMs()/60000));
    min.value=String(Math.min(m,130));
  }
}
function clockText(){
  const s=Math.floor(clockMs()/1000);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function clockMinuteTaken(){ if(clockRunning()) clockTick(); }
function paintClockState(){
  const el=document.getElementById("g-clock");
  const box=document.getElementById("g-clockbox");
  const btn=document.getElementById("g-clockbtn");
  if(el) el.textContent=clockText();
  if(box) box.classList.toggle("running", clockRunning());
  if(btn) btn.innerHTML=clockRunning()?ic("pause",13)+" Pause":ic("play",13)+" Start";
}
function goalMinManual(el){ if(el) delete el.dataset.auto; }
function goalMinAuto(el){
  if(el && el.value===""){ el.dataset.auto="1"; clockTick(); }
}

function squadOfCode(code){
  if(!S || !S.teams) return [];
  const nm=S.labelOf[code]||code;
  const t=S.teams.find(x=>x.name===nm);
  if(!t) return [];
  // the captain is a player too — she can score (and own-goal)
  const list=[t.captain, ...(t.players||[])].filter(Boolean);
  return [...new Set(list.map(x=>String(x).trim()).filter(Boolean))];
}
function openMatchForm(id, mode){
  const mx=S && S.matchIndex ? S.matchIndex.matches : [];
  const m=mx.find(x=>x.id===id);
  if(!m){ toast("That match isn't in the list anymore.","error"); return; }
  if(mode!=="correct" && m.played){ toast("That score is already saved — correct it instead.","error"); return; }
  if(mode==="correct" && !m.editable){ toast(m.lockReason||"That match can't be corrected.","error"); return; }
  closeMatchForm(true);
  OPEN_FORM={
    id, mode,
    roundIndex:m.roundIndex, mi:m.mi,
    a:m.a, b:m.b, aName:m.aName, bName:m.bName,
    needsWinner:!!m.needsWinner,
    goals:(m.goals||[]).map(g=>({min:g.min, team:g.team, scorer:g.scorer, own:!!g.own})),
    editingIdx:null
  };
  GOAL_CLOCK={acc:0, since:null, int:null};
  const d=document.createElement("div");
  d.className="mx-back"; d.id="mxModal";
  d.onclick=e=>{ if(e.target===d) closeMatchForm(); };
  d.innerHTML=matchModalHTML();
  document.body.appendChild(d);
  paintClockState();
  refreshGoalNeed();
  const first=document.getElementById("ix-sa");
  if(first) first.focus();
}
function closeMatchForm(silent){
  if(GOAL_CLOCK.int){ clearInterval(GOAL_CLOCK.int); GOAL_CLOCK.int=null; }
  const m=document.getElementById("mxModal");
  if(m) m.remove();
  OPEN_FORM=null;
  if(!silent) render();
}
function matchModalHTML(){
  const F=OPEN_FORM;
  const correcting=F.mode==="correct";
  const mx=S && S.matchIndex ? S.matchIndex.matches : [];
  const m=mx.find(x=>x.id===F.id) || {};
  const sa=m.played?m.scoreA:"";
  const sb=m.played?m.scoreB:"";
  const pa=m.penA!=null?m.penA:"";
  const pb=m.penB!=null?m.penB:"";
  const pens=F.needsWinner?`
    <div class="mx-pens"><span>If level — pens:</span>
      <input type="number" id="ix-pa" inputmode="numeric" autocomplete="off" min="0" placeholder="–" value="${pa}">
      <span>–</span>
      <input type="number" id="ix-pb" inputmode="numeric" autocomplete="off" min="0" placeholder="–" value="${pb}"></div>`:"";
  return `<div class="mx-form-box" role="dialog" aria-label="Score a match">
    <h3>${correcting?"Correct the sheet":"Goal sheet"}</h3>
    <div class="note-hand" style="margin:-2px 0 4px">${correcting?`fix the score or any wrong goal below`:`${esc(F.aName)} vs ${esc(F.bName)} — ${(S.duration||90)}’ + ${(S.breakMins!=null?S.breakMins:15)}’ break`}</div>
    <div class="scoreline">
      <span class="teamname">${esc(F.aName)}</span>
      <input type="number" id="ix-sa" inputmode="numeric" autocomplete="off" min="0" placeholder="0" value="${sa}" oninput="refreshGoalNeed()">
      <span class="vs display">–</span>
      <input type="number" id="ix-sb" inputmode="numeric" autocomplete="off" min="0" placeholder="0" value="${sb}" oninput="refreshGoalNeed()">
      <span class="teamname">${esc(F.bName)}</span>
    </div>
    ${pens}
    ${goalBoxHTML()}
    <div class="mx-form-actions">
      <button class="btn" onclick="submitMatchModal('${correcting?"editScoreAt":"saveScoreAt"}')">
        ${ic("check",14)} ${correcting?"Save correction":"Save score"}
      </button>
      <button class="btn secondary" onclick="closeMatchForm()">Cancel</button>
    </div>
    ${correcting?`<p class="hint" style="margin:10px 2px 0">Correcting rebuilds the table; anything already played on top of this result stays untouched.</p>`
      :`<p class="hint" style="margin:10px 2px 0">The goal sheet is optional — but when you keep it, every goal needs a scorer and it has to add up to the score. ${F.needsWinner?"A level score needs the shootout too.":""}</p>`}
  </div>`;
}
function goalBoxHTML(){
  const F=OPEN_FORM;
  const squadA=squadOfCode(F.a), squadB=squadOfCode(F.b);
  const editing=F.editingIdx!=null && F.goals[F.editingIdx];
  const own=document.getElementById("g-own");
  // an entry being edited always wins over whatever the old inputs held
  const ownChecked=editing?editing.own:(own?own.checked:false);
  const teamVal=editing?editing.team:(document.getElementById("g-team")?document.getElementById("g-team").value:F.a);
  const scorerPool=(teamVal===F.b)?(ownChecked?squadA:squadB):(ownChecked?squadB:squadA);
  const minVal=editing?editing.min:(document.getElementById("g-min")?document.getElementById("g-min").value:"");
  const scorerVal=editing?editing.scorer:"";
  const scorerOptions=(scorerPool.length)
    ? scorerPool.map(p=>`<option value="${esc(p)}"${String(p)===String(scorerVal)?" selected":""}>${esc(p)}</option>`).join("")
    : `<option value="">${ownChecked?"opponent player":"player"}…</option>`;
  const chips=F.goals.length?`<div class="goal-list">${F.goals.map((g,i)=>{
    const nm=g.team===F.a?F.aName:F.bName;
    return `<span class="goal-chip${g.own?" og":""}${F.editingIdx===i?" goal-editing":""}">
      <span class="gmin">${g.min}’</span> ${esc(g.scorer)}${g.own?`<span class="og-tag">og</span>`:""} <span style="color:var(--muted);font-weight:500">${esc(nm||"")}</span>
      <button type="button" onclick="goalEdit(${i})" title="Edit this goal">${ic("pencil",12)}</button>
      <button type="button" onclick="goalRemove(${i})" title="Remove this goal">${ic("cross",11)}</button>
    </span>`;
  }).join("")}</div>`:"";
  return `<div class="goalbox">
    <div class="gt">${ic("goalNet",16)} Goals <span class="muted" style="font-weight:500">— tap a scorer, clock optional</span></div>
    <div class="goal-clock" id="g-clockbox">
      <span class="clock" id="g-clock">00:00</span>
      <button type="button" class="btn tiny secondary" id="g-clockbtn" onclick="clockToggle()">${ic("play",13)} Start</button>
      <button type="button" class="btn tiny secondary" onclick="clockReset()">${ic("refresh",13)} Reset</button>
      <span class="note-hand" style="margin-left:auto">the running minute fills itself in</span>
    </div>
    <div class="goal-add">
      <div><label for="g-min">Minute</label>
        <input type="number" id="g-min" class="gmin" inputmode="numeric" autocomplete="off" min="1" max="130" placeholder="–" value="${minVal}" oninput="goalMinManual(this)" onblur="goalMinAuto(this)"></div>
      <div><label for="g-team">Scores for</label>
        <select id="g-team" onchange="goalTeamChanged()">
          <option value="${esc(F.a)}"${teamVal===F.a?" selected":""}>${esc(F.aName)}</option>
          <option value="${esc(F.b)}"${teamVal===F.b?" selected":""}>${esc(F.bName)}</option>
        </select></div>
      <div><label for="g-scorer">Scorer</label>
        <select id="g-scorer">${scorerOptions}</select></div>
      <label class="own-wrap" for="g-own"><input type="checkbox" id="g-own" onchange="goalTeamChanged()"${ownChecked?" checked":""}> own goal</label>
      <button type="button" class="btn tiny" onclick="goalAdd()">${editing?ic("check",12)+" Save goal":ic("plus",12)+" Add goal"}</button>
      ${F.editingIdx!=null?`<button type="button" class="btn tiny secondary" onclick="goalCancelEdit()">Cancel edit</button>`:""}
    </div>
    ${chips}
    <div class="goal-need" id="g-need"></div>
  </div>`;
}
function goalTeamChanged(){
  // the scorer list depends on side + own-goal — repaint just the pool
  const F=OPEN_FORM;
  const teamSel=document.getElementById("g-team");
  const own=document.getElementById("g-own");
  const scorerSel=document.getElementById("g-scorer");
  if(!teamSel || !scorerSel) return;
  const team=teamSel.value;
  const ownChecked=own?own.checked:false;
  const pool=(team===F.b)?(ownChecked?squadOfCode(F.a):squadOfCode(F.b)):(ownChecked?squadOfCode(F.b):squadOfCode(F.a));
  const prev=scorerSel.value;
  scorerSel.innerHTML=pool.length
    ? pool.map(p=>`<option value="${esc(p)}"${String(p)===String(prev)?" selected":""}>${esc(p)}</option>`).join("")
    : `<option value="">player…</option>`;
}
function goalAdd(){
  const F=OPEN_FORM;
  const minEl=document.getElementById("g-min");
  const teamEl=document.getElementById("g-team");
  const scorerEl=document.getElementById("g-scorer");
  const ownEl=document.getElementById("g-own");
  const min=parseInt(minEl&&minEl.value,10);
  if(!Number.isFinite(min) || min<1 || min>130){ toast("Goal minutes run from 1 to 130.","error"); return; }
  const team=teamEl?teamEl.value:null;
  if(team!==F.a && team!==F.b){ toast("Pick which side scored.","error"); return; }
  const scorer=scorerEl?String(scorerEl.value).trim():"";
  const pool=(team===F.b)?((ownEl&&ownEl.checked)?squadOfCode(F.a):squadOfCode(F.b)):((ownEl&&ownEl.checked)?squadOfCode(F.b):squadOfCode(F.a));
  if(!scorer){ toast("Pick the player who scored.","error"); return; }
  if(pool.length && !pool.some(p=>String(p).toLowerCase()===scorer.toLowerCase())){
    toast(scorer+" isn't in that side's squad.","error"); return;
  }
  const entry={min, team, scorer, own:!!(ownEl&&ownEl.checked)};
  if(F.editingIdx!=null){ F.goals[F.editingIdx]=entry; F.editingIdx=null; }
  else { F.goals.push(entry); }
  F.goals.sort((a,b)=>a.min-b.min);
  repaintGoalBox();
  refreshGoalNeed();
}
function goalEdit(i){
  const F=OPEN_FORM;
  if(!F || !F.goals[i]) return;
  F.editingIdx=i;
  repaintGoalBox();
}
function goalCancelEdit(){ if(OPEN_FORM){ OPEN_FORM.editingIdx=null; repaintGoalBox(); } }
function goalRemove(i){
  const F=OPEN_FORM;
  if(!F || !F.goals[i]) return;
  F.goals.splice(i,1);
  if(F.editingIdx===i) F.editingIdx=null;
  else if(F.editingIdx!=null && F.editingIdx>i) F.editingIdx--;
  repaintGoalBox();
  refreshGoalNeed();
}
function repaintGoalBox(){
  const box=document.querySelector("#mxModal .goalbox");
  if(!box){ closeMatchForm(true); return; }
  box.outerHTML=goalBoxHTML();
  paintClockState();
}
function refreshGoalNeed(){
  const F=OPEN_FORM;
  const el=document.getElementById("g-need");
  if(!F || !el) return;
  const g=id=>{ const x=document.getElementById(id); const v=x?parseInt(x.value,10):NaN; return Number.isFinite(v)?v:0; };
  const sa=g("ix-sa"), sb=g("ix-sb");
  const ca=F.goals.filter(x=>x.team===F.a).length;
  const cb=F.goals.filter(x=>x.team===F.b).length;
  const line=(nm,got,need)=>`${esc(nm)}: <b>${got}</b> of ${need} on the sheet`;
  const done=(sa===ca && sb===cb);
  el.className="goal-need"+(done?"":" bad");
  el.innerHTML=F.goals.length||sa||sb
    ? line(F.aName,ca,sa)+" · "+line(F.bName,cb,sb)+(done?" "+ic("check",12):"")
    : "no goals on the sheet yet — a plain score works too";
}
function submitMatchModal(action){
  const F=OPEN_FORM;
  if(!F) return;
  const g=id=>{ const el=document.getElementById(id); const v=el?parseInt(el.value,10):NaN; return Number.isFinite(v)?v:null; };
  const sa=g("ix-sa"), sb=g("ix-sb");
  const ca=F.goals.filter(x=>x.team===F.a).length;
  const cb=F.goals.filter(x=>x.team===F.b).length;
  if(F.goals.length && (ca!==sa || cb!==sb)){
    toast("The goal sheet doesn't add up — "+F.aName+" "+ca+"/"+sa+", "+F.bName+" "+cb+"/"+sb+".","error");
    return;
  }
  clockStop();
  const p={roundIndex:F.roundIndex, mi:F.mi, sa, sb, goals:F.goals.length?F.goals:null};
  if(F.needsWinner){ p.penA=g("ix-pa"); p.penB=g("ix-pb"); }
  // The modal stays up until the server confirms: a rejected sheet
  // (scorer not in the squad, missing shootout…) keeps the draft.
  F.submitting=true;
  F.sent={roundIndex:F.roundIndex, mi:F.mi, action, p};
  sendAction(action, p);
}
// Called from the state handler: close the modal only when the match
// actually took the submitted result.
function settleOpenForm(){
  const F=OPEN_FORM;
  if(!F || !F.submitting) return;
  const sent=F.sent;
  if(!sent || !S || !S.matchIndex) return;
  const m=S.matchIndex.matches.find(x=>x.roundIndex===sent.roundIndex && x.mi===sent.mi);
  if(!m){ F.submitting=false; return; }
  let ok=false;
  if(sent.action==="saveScoreAt"){
    ok=(m.played && !m.annulled);
  } else {
    // correction: success when the match now carries the sent score
    ok=(m.played && m.scoreA===sent.p.sa && m.scoreB===sent.p.sb
      && (m.goals||[]).length===(sent.p.goals||[]).length);
  }
  if(ok){
    OPEN_FORM=null;
    const el=document.getElementById("mxModal");
    if(el) el.remove();
  } else {
    F.submitting=false; // rejected — the draft stays for editing
  }
}
function undoEditAction(){ sendAction("undoEdit", {}); }

/* ---- mid-tournament roster ops (v1.7): teams join / withdraw ---- */
function rosterOpsHTML(){
  if(MY_ROLE!=="admin" || S.step!=="play") return "";
  const stage=S.stages && S.stages[S.stageIndex];
  if(!stage) return "";
  const list=(stage.type==="pools")
    ? stage.pools.flatMap(p=>p.members)
    : (stage.entrants||[]);
  const withdrawn=(S.withdrawn||[]).map(c=>S.labelOf[c]||c);
  const chips=list.map(code=>{
    const nm=S.labelOf[code]||code;
    return `<span class="pill" title="Withdraw ${esc(nm)} — their results are annulled or their match forfeited">${esc(nm)}<button aria-label="Withdraw ${esc(nm)}" onclick="askWithdraw('${code}')">${ic("cross",10)}</button></span>`;
  }).join("");
  const canJoin=stage.type==="rr" || stage.type==="pools";
  const joinForm=canJoin?`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <input type="text" id="joinTeamInput" maxlength="40" placeholder="Late team's name" style="flex:1;min-width:120px" autocomplete="off">
      <input type="text" id="joinCaptainInput" maxlength="40" placeholder="Captain" style="flex:1;min-width:100px" autocomplete="off">
      <button class="btn small" onclick="joinMidAction()">${ic("users",13)} Add team</button>
    </div>
    <p class="hint" style="margin:6px 0 0">A late team joins the running group — fixtures against everyone, spread over the rounds left to play.</p>`:"";
  return `<div class="panel roster-ops" style="margin-top:18px">
    <div class="pt">Squads during the tournament</div>
    <div class="pill-list">${chips || '<span class="muted">Nobody left in the running stage.</span>'}</div>
    ${withdrawn.length?`<p class="hint" style="margin:0 0 8px">Left: ${withdrawn.map(esc).join(", ")} — their results were annulled (or their match forfeited).</p>`:""}
    <p class="hint" style="margin:0">${stage.type==="elim"||stage.type==="hybrid"?"The × withdraws a team — their next match is forfeited 3–0 and the opponent advances.":"The × withdraws a team — their played matches are annulled and the table is rebuilt (the international rule)."}</p>
    ${joinForm}
  </div>`;
}
function joinMidAction(){
  const t=document.getElementById("joinTeamInput");
  const c=document.getElementById("joinCaptainInput");
  const teamName=t?t.value.trim():"";
  const captain=c?c.value.trim():"";
  if(!teamName){ toast("Enter the team's name first.","error"); return; }
  if(!captain){ toast("Enter the captain's name.","error"); return; }
  sendAction("joinMid", {teamName, captain, players:[]});
}
function askWithdraw(code){
  const nm=S.labelOf[code]||code;
  if(!confirm("Withdraw "+nm+" from the tournament?\n\nGroup play: their played matches are annulled and the table is rebuilt.\nKnockout: their next match is forfeited 3–0 — the opponent advances.")) return;
  sendAction("withdraw", {code});
}

/* ---- team profiles (v1.7 + v1.8): squad, season record and the
   players' goal tallies in one card. Tap a leaderboard row or a
   match badge to open it. ---- */
function openTeamProfile(name){
  closeSquad();
  const d=document.createElement("div");
  d.className="squad-back"; d.id="squadModal";
  d.onclick=e=>{ if(e.target===d) closeSquad(); };
  const reg=(PLAYERS_DB||[]).find(x=>normKey(x.name)===normKey(name));
  const p=SEASON && SEASON.players ? SEASON.players[normKey(name)] : null;
  const cur=(S && S.teams||[]).find(t=>t.name===name);
  const squad=reg||cur;
  // the squad sheet: captain first, then the rest — everyone who can score
  const captain=(squad && squad.captain)||null;
  const players=[...new Set([captain, ...((squad && squad.players)||[])].map(x=>String(x||"").trim()).filter(Boolean))];
  let stats="";
  if(p){
    stats=`<div class="pgrid">
      <div class="pstat"><b>${p.rating}</b><span>rating</span></div>
      <div class="pstat"><b>${p.played||0}</b><span>matches</span></div>
      <div class="pstat"><b>${(p.won||0)+"–"+(p.drawn||0)+"–"+(p.lost||0)}</b><span>w–d–l</span></div>
      <div class="pstat"><b>${p.titles||0}</b><span>titles</span></div>
      <div class="pstat"><b>${(p.pf||0)}:${(p.pa||0)}</b><span>goals</span></div>
      <div class="pstat"><b>${p.winPct||0}%</b><span>win rate</span></div>
    </div>`;
  }
  // v1.8 — per-player goal stats: this tournament (from the wire
  // tally) and the whole season (from the archive), own goals apart
  const tKey=normKey(name);
  const nowTally=(S && S.scorers||[]).filter(x=>x.teamName===name || normKey(x.teamName)===tKey);
  const seasonTally=(SEASON && SEASON.scorers||[]).filter(x=>x.teamKey===tKey || normKey(x.team)===tKey);
  const tallyOf=(list)=>{
    const m=new Map();
    list.forEach(x=>{
      const k=x.name;
      if(!m.has(k)) m.set(k, {name:x.name, goals:0, own:0});
      m.get(k).goals+=x.goals||0;
      m.get(k).own+=x.own||0;
    });
    return [...m.values()].sort((a,b)=>(b.goals-a.goals)||(a.own-b.own)||a.name.localeCompare(b.name));
  };
  const nowMap=tallyOf(nowTally), seasonMap=tallyOf(seasonTally);
  const games=(S && S.matchIndex) ? (S.matchIndex.matches||[]).filter(m=>!m.annulled && !m.bye && m.played && (normKey(m.aName)===tKey || normKey(m.bName)===tKey)).length : 0;
  let playerTable="";
  if(players.length){
    const rows=players.map(pl=>{
      const n=nowMap.find(x=>normKey(x.name)===normKey(pl));
      const sn=seasonMap.find(x=>normKey(x.name)===normKey(pl));
      const goals=n?n.goals:0, own=n?n.own:0;
      const sGoals=sn?sn.goals:0, sOwn=sn?sn.own:0;
      const isCap=captain && normKey(pl)===normKey(captain);
      return `<tr>
        <td>${esc(pl)}${isCap?` <span class="og-note" title="team captain">c</span>`:""}</td>
        <td class="num">${goals?`<b>${goals}</b>`:"—"}</td>
        <td class="num">${own?`<b>${own}</b>`:"—"}</td>
        <td class="num">${sGoals||sOwn?(sGoals+" / "+sOwn):"—"}</td>
      </tr>`;
    }).join("");
    playerTable=`<div class="prow" style="margin-top:10px"><b>Squad</b> <span class="muted" style="font-weight:500">— goals this tournament${games?(" · "+games+" played"):""}</span></div>
    <table class="sheet scorer-table">
      <thead><tr><th>Player</th><th class="num">Goals</th><th class="num">og</th><th class="num">season G/og</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }
  d.innerHTML=`<div class="profile-box" role="dialog" aria-label="Team profile">
    <h3>${esc(name)}${p&&p.star?` <span class="star">${ic("starFill",14)}</span>`:""}</h3>
    ${reg?`<span class="uid-chip" title="Team UID — the stable identity across tournaments">${esc(reg.uid)}</span>`:""}
    ${stats}
    ${captain?`<div class="prow"><b>Captain:</b> ${esc(captain)}</div>`:""}
    ${playerTable || (players.length?"":(captain?"":'<p class="hint">No squad details saved.</p>'))}
    ${(p&&p.reasons&&p.reasons.length)?`<p class="hint">${esc(p.reasons.join("; "))}</p>`:""}
    <div class="close-row">
      ${MY_ROLE==="admin"?`<button class="btn small secondary" onclick="profileStar('${esc(name)}')">${p&&p.star?"Remove star":"Mark as star"}</button>`:""}
      <button class="btn small" onclick="closeSquad()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(d);
}

// Display-only standings: use the server's authoritative order
// (rankOrder) when present, else sort locally.
function standingsOf(table, codes){
  if(S && S.rankOrder && S.rankOrder.length){
    const pos=new Map(S.rankOrder.map((c,i)=>[c,i]));
    return codes.slice().sort((a,b)=>{
      const pa=pos.has(a)?pos.get(a):S.rankOrder.length;
      const pb=pos.has(b)?pos.get(b):S.rankOrder.length;
      if(pa!==pb) return pa-pb;
      return codes.indexOf(a)-codes.indexOf(b);
    }).map(c=>table[c]);
  }
  const compareTeams=(t1,t2)=>{
    if((t1.pts||0)!==(t2.pts||0)) return (t2.pts||0)-(t1.pts||0);
    if(t1.diff!==t2.diff) return t2.diff-t1.diff;
    return t2.pf-t1.pf;
  };
  return codes.map(c=>table[c]).sort(compareTeams);
}

/* ---- flow tab: the whole tournament as one map ----
   Stage strip on top, then per stage: pool cards, knockout bracket
   columns with connectors, or a round-robin card. */

function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }
let SEASON_ROWS=[]; // sortable leaderboard rows (for star toggling)

function renderFlowTab(){
  if(!S || !S.schedule || ["roster","mode","pairing","teamsFormed","toomany"].includes(S.step)){
    return `<h2 class="section">Tournament flow</h2>
      <div class="empty"><span class="big">${ic("map",30)}</span>No draw yet — start a tournament in the <b>Live score</b> tab.</div>`;
  }
  const stages=stageListForDisplay();
  let html=`<h2 class="section">Tournament flow</h2>`;
  html+=flowStripHTML();
  stages.forEach((st,si)=>{
    html+=`<div class="round-title" style="font-size:19px; margin-top:${si?"22":"6"}px;">Stage ${si+1} <span class="round-badge">${esc(stageTypeName(st))}</span></div>`;
    if(st.type==="pools") html+=poolsBoardHTML(st);
    else if(st.type==="elim") html+=bracketHTML(st, st.roundIdxs);
    else if(st.type==="rr") html+=rrBoardHTML(st);
    else if(st.type==="hybrid") html+=hybridBoardHTML(st);
    else html+=legacyBoardHTML(st);
  });
  html+=championNodeHTML();
  html+=eventStripHTML();
  return html;
}

// group round indices per stage; untagged rounds (tie-breaks,
// decision finals) attach to the stage they followed. Round arrays
// lose their stageIndex tag over the wire — read it from roundMeta.
function roundsByStage(){
  const out={};
  if(!S.schedule) return out;
  const meta=(S.schedule.roundMeta||{}).stageIndex||{};
  let cur=(S.stages && S.stages.length)?S.stages[0].idx:null;
  S.schedule.rounds.forEach((r,i)=>{
    const tag=(meta[i]!=null)?meta[i]:(r && r.stageIndex!=null?r.stageIndex:null);
    if(tag!=null) cur=tag;
    (out[cur]=out[cur]||[]).push(i);
  });
  return out;
}
function stageListForDisplay(){
  if(!S.schedule) return [];
  const groups=roundsByStage();
  if(S.stages && S.stages.length){
    return S.stages.map(st=>Object.assign({}, st, {roundIdxs:groups[st.idx]||[]}));
  }
  return [{type:"legacy", idx:null, entrants:S.entities, advance:null, roundIdxs:groups[null]||[]}];
}

function stageComplete(st){
  if(!st.roundIdxs || !st.roundIdxs.length) return false;
  return st.roundIdxs.every(ri=>{
    const r=S.schedule.rounds[ri];
    return r && r.every(m=>m.played);
  });
}
function stageTypeName(st){
  if(st.type==="pools") return "Pools ×"+(st.pools?st.pools.length:"?");
  if(st.type==="elim") return "Knockout";
  if(st.type==="rr") return "Round robin"+(st.advance?(" "+ic("arrowRight",11)+" top "+st.advance):"");
  if(st.type==="hybrid") return "Hybrid";
  if(S.schedule && S.schedule.kind==="elim") return "Knockout";
  if(S.schedule && S.schedule.kind==="hybrid") return "Hybrid";
  return "Round robin";
}
function flowStripHTML(){
  const stages=stageListForDisplay();
  const nowIdx=(S.step==="play" && S.stageIndex>=0)?S.stageIndex:-1;
  const chips=stages.map((st,i)=>{
    const done=stageComplete(st);
    const now=(st.idx!=null && st.idx===nowIdx);
    return `<span class="flow-chip ${done?"done":""} ${now?"now":""}">${i+1} · ${esc(stageTypeName(st))}</span>`;
  }).join(`<span class="flow-arrow">${ic("arrowRight",13)}</span>`);
  const champ=S.champion
    ? `<span class="flow-chip done">${ic("trophy",13)} ${esc(S.labelOf[S.champion]||"Champion")}</span>`
    : `<span class="flow-arrow">${ic("arrowRight",13)}</span><span class="flow-chip ${S.step==="standings"?"now":""}">Champion</span>`;
  return `<div class="flow-strip">${chips}${champ}</div>`;
}

function outSetNow(){
  if(!S.schedule) return new Set();
  const upto=(S.step==="standings")?S.schedule.rounds.length:S.roundIndex;
  return eliminatedSoFar(S.schedule, upto);
}
function firstPendingIdx(ri){
  if(!S.schedule || ri!==S.roundIndex) return -1;
  const round=S.schedule.rounds[ri];
  if(!round) return -1;
  for(let i=0;i<round.length;i++) if(!round[i].played) return i;
  return -1;
}

/* ---- knockout bracket ---- */

function roundTitleOf(ri, ci, roundIdxs, st){
  const meta=(S.schedule && S.schedule.roundMeta)||{};
  if(meta.stageLabel && meta.stageLabel[ri]) return meta.stageLabel[ri];
  const round=S.schedule.rounds[ri]||[];
  if(round[0] && round[0].isFinal) return "Final";
  // rounds appended past a knockout's natural length are tie-breaks
  if(st && (st.type==="elim") && roundIdxs && ci>=Math.log2(nextPow2(st.entrants.length))) return "Tie-break";
  const players=round.length*2;
  if(players===2) return "Final";
  if(players===4) return "Semifinals";
  if(players===8) return "Quarterfinals";
  if(players===16) return "Round of 16";
  if(players===32) return "Round of 32";
  return "Round "+(ci+1);
}

function matchNodeHTML(m, ri, mi){
  const upIdx=firstPendingIdx(ri);
  const isUp=(upIdx===mi && !m.played && S.step==="play");
  const cls=["b-match"];
  if(isUp) cls.push("live");
  if(m.a==="BYE" || m.b==="BYE") cls.push("bye");
  const out=outSetNow();
  const row=(code,sc)=>{
    if(!code) return `<div class="b-row tbd"><span class="nm">To be decided</span></div>`;
    const label=(code==="BYE")?"— bye —":(S.labelOf[code]||code);
    const w=m.played && m.winner===code;
    const rcls=["b-row"];
    if(m.played) rcls.push(w?"w":"l");
    if(out.has(code) && code!=="BYE") rcls.push("out");
    const star=(code!=="BYE")?starHTML(S.labelOf[code]||code):"";
    return `<div class="${rcls.join(" ")}"><span class="nm">${esc(label)}${star}</span><span class="sc">${m.played?sc:""}</span></div>`;
  };
  return `<div class="${cls.join(" ")}">
    ${row(m.a,m.scoreA)}
    ${row(m.b,m.scoreB)}
    ${isUp?`<div class="b-live">UP NEXT</div>`:""}
  </div>`;
}

function bracketHTML(st, roundIdxs){
  if(!roundIdxs || !roundIdxs.length) return "";
  const cols=roundIdxs.map((ri,ci)=>{
    const round=S.schedule.rounds[ri]||[];
    const title=roundTitleOf(ri, ci, roundIdxs, st);
    const isLast=ci===roundIdxs.length-1;
    const nextRound=!isLast?(S.schedule.rounds[roundIdxs[ci+1]]||[]):null;
    // pair two matches into the next round's slot with a connector
    const pairable=!isLast && nextRound && round.length%2===0 && nextRound.length===round.length/2;
    let inner="";
    if(pairable){
      for(let k=0;k<round.length;k+=2){
        inner+=`<div class="b-join"><div class="b-slot">${matchNodeHTML(round[k],ri,k)}</div><div class="b-slot">${matchNodeHTML(round[k+1],ri,k+1)}</div></div>`;
      }
    } else {
      inner=round.map((m,mi)=>`<div class="b-slot">${matchNodeHTML(m,ri,mi)}</div>`).join("");
    }
    return `<div class="b-col ${ci===0?"first":""} ${isLast?"last":""}">
      <div class="b-col-title">${esc(title)}</div>
      <div class="b-stack">${inner}</div>
    </div>`;
  });
  return `<div class="bracket-wrap"><div class="b-cols">${cols.join("")}</div></div>`;
}

/* ---- pools board ---- */

function poolsBoardHTML(st){
  const quals=new Set(st.qualifiers||[]);
  const out=outSetNow();
  const cards=st.pools.map(p=>{
    const order=standingsOf(S.table, p.members).map(t=>t.code);
    const rows=order.map((code,i)=>{
      const t=(S.table[code]||{wins:0,losses:0,diff:0});
      const isQ=quals.has(code);
      const isOut=out.has(code) && !isQ;
      const name=S.labelOf[code]||code;
      return `<div class="pool-row ${isQ?"q":""} ${isOut?"out":""}">
        <span class="rk">${i+1}</span>
        <span class="nm">${esc(name)}${starHTML(name)}</span>
        <span class="wl">${t.pts||0} pts · ${t.wins}-${t.draws||0}-${t.losses} · ${t.diff>0?"+":""}${t.diff}</span>
      </div>`;
    }).join("");
    return `<div class="pool-card">
      <div class="ph"><span>Pool ${esc(String(p.name))}</span><span class="q">${p.qualify} ${p.qualify===1?"qualifies":"qualify"}</span></div>
      ${rows}
    </div>`;
  }).join("");
  return `<div class="pool-grid">${cards}</div>`;
}

/* ---- round-robin board ---- */

function rrBoardHTML(st){
  const entrants=(st && st.entrants) ? st.entrants : S.entities;
  const out=outSetNow();
  const order=standingsOf(S.table, entrants);
  const rows=order.map((t,i)=>{
    const champ=(S.champion===t.code);
    const name=S.labelOf[t.code]||t.code;
    return `<tr class="${champ?"leader":""} ${out.has(t.code)?"out":""}">
      <td class="num">${i+1}</td>
      <td>${esc(name)}${starHTML(name)}${champ?' <span class="out-tag" style="background:var(--gold);color:var(--ink);">CHAMPION</span>':(out.has(t.code)?' <span class="out-tag">OUT</span>':"")}</td>
      <td class="num">${t.played||0}</td><td class="num">${t.wins}</td><td class="num">${t.draws||0}</td><td class="num">${t.losses}</td><td class="num">${t.pf}</td><td class="num">${t.diff>0?'+':''}${t.diff}</td><td class="num"><b>${t.pts||0}</b></td>
    </tr>`;
  }).join("");
  const note=(st && st.advance)?`<p class="hint" style="margin:0 0 10px;">Top ${st.advance} advance to the next stage.</p>`:"";
  return `${note}<table class="sheet">
    <thead><tr><th class="num">#</th><th>Entrant</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GD</th><th class="num">Pts</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ---- hybrid & legacy draws ---- */

function hybridBoardHTML(st){
  const k=st.k||2;
  const el=bracketHTML(st, st.roundIdxs.slice(0,k));
  const rrEntrants=(S.schedule && S.schedule.survivors)?S.schedule.survivors:st.entrants;
  return el+`<div class="round-title" style="font-size:16px; margin-top:18px;">Final group</div>`+rrBoardHTML({entrants:rrEntrants});
}
function legacyBoardHTML(st){
  const kind=S.schedule.kind;
  if(kind==="elim") return bracketHTML(st, st.roundIdxs);
  if(kind==="hybrid"){
    const k=S.schedule.k||2;
    return bracketHTML(st, st.roundIdxs.slice(0,k))
      +`<div class="round-title" style="font-size:16px; margin-top:18px;">Final group</div>`
      +rrBoardHTML({entrants:(S.schedule.survivors||S.entities)});
  }
  return rrBoardHTML({entrants:S.entities});
}

function championNodeHTML(){
  if(!S.champion) return "";
  const name=S.labelOf[S.champion]||"";
  return `<div class="champion-block reveal" style="margin-top:18px; padding:24px 16px;">
    <div class="trophy">${ic("trophy",44)}</div>
    <div class="cap">Champion</div>
    <div class="name">${esc(name)}${starHTML(name)}</div>
  </div>`;
}

function eventStripHTML(){
  const ev=(S.events||[]).slice(-4).reverse();
  if(!ev.length) return "";
  return `<div class="event-strip"><div class="et">Decision log</div>${ev.map(e=>`<div class="ev">· ${esc(e.text)}</div>`).join("")}</div>`;
}

/* ---- season tab: ratings leaderboard, stars, history, data tools ---- */

function renderSeasonTab(){
  if(!SEASON) return `<h2 class="section">Season</h2><div class="empty">Connecting…</div>`;
  const playerCount=SEASON.order?SEASON.order.length:0;
  const since=SEASON.createdAt?new Date(SEASON.createdAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"";
  let html=`<h2 class="section">${esc(SEASON.name)}</h2>`;
  html+=`<p class="season-sub">${SEASON.completedCount} recorded · ${SEASON.abandonedCount||0} abandoned · ${playerCount} player${playerCount===1?"":"s"} · ${SEASON.starCount} star${SEASON.starCount===1?"":"s"} · since ${esc(String(since))}</p>`;
  const info=backupInfo();
  if(MY_ROLE==="admin" && SEASON.tournamentCount===0 && info && info.count>0){
    html+=`<div class="restore-bar">${ic("save",15)} This browser holds a backup of <b>${info.count} tournament${info.count===1?"":"s"}</b>${info.name?(" from “"+esc(info.name)+"”"):""} — restore it to this server?
      <button class="btn small" onclick="restoreBackup()">Restore backup</button></div>`;
  }
  html+=leaderboardHTML();
  html+=scorersHTML();
  html+=historyHTML();
  if(MY_ROLE==="admin") html+=seasonToolsHTML();
  return html;
}

/* ---- v1.8: the season's leading scorers, own goals apart ---- */
function scorersHTML(){
  const list=(SEASON && SEASON.scorers)||[];
  if(!list.length) return "";
  const rows=list.slice(0,12).map((s,i)=>`
    <tr class="${i===0?"leader":""}">
      <td class="num">${i+1}</td>
      <td><b>${esc(s.name)}</b><br><span class="tname">${esc(s.team)}</span></td>
      <td class="num"><b>${s.goals}</b></td>
      <td class="num">${s.own||"—"}</td>
    </tr>`).join("");
  return `
  <div class="round-title" style="font-size:19px; margin-top:24px;">${ic("whistle",16)} Top scorers — the golden boot</div>
  <p class="season-sub">From every goal sheet kept this season. Own goals sit in their own column — they belong to the player, not the tally.</p>
  <div class="sheet-scroll"><table class="sheet scorer-table">
    <thead><tr><th class="num">#</th><th>Player</th><th class="num">Goals</th><th class="num">og</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function leaderboardHTML(){
  if(!SEASON.order || !SEASON.order.length){
    return `<div class="empty"><span class="big">${ic("calendar",30)}</span>No matches recorded yet.<br>Run a tournament — teams, ratings and titles land here.</div>`;
  }
  const players=SEASON.order.map(k=>SEASON.players[k]).filter(Boolean);
  const sortKey=SEASON_SORT.key, dir=SEASON_SORT.dir;
  const sorted=players.slice().sort((a,b)=>{
    if(sortKey==="name") return dir*a.name.localeCompare(b.name);
    const va=(sortKey==="winPct")?(a.won/(a.played||1)):(a[sortKey]||0);
    const vb=(sortKey==="winPct")?(b.won/(b.played||1)):(b[sortKey]||0);
    return dir*(va-vb);
  });
  SEASON_ROWS=sorted;
  const th=(key,label,cls)=>`<th class="${cls||""}"><button class="th-sort" onclick="sortSeason('${key}')" title="Sort by ${label}">${label}${SEASON_SORT.key===key?(SEASON_SORT.dir===-1?" "+ic("chevronDown",11):" "+ic("chevronUp",11)):""}</button></th>`;
  const rows=sorted.map((p,i)=>{
    const starBtn=MY_ROLE==="admin"
      ? ` <button class="star-btn ${p.star?"on":""}" onclick="toggleStarAt(${i})" title="${p.star?"Remove the star":"Mark as a star team"}">${p.star?ic("starFill",12):ic("star",12)}</button>`
      : "";
    return `<tr class="click-row" onclick="openTeamProfile('${esc(p.name)}')" title="Open ${esc(p.name)}'s profile">
      <td class="num">${i+1}</td>
      <td><b>${esc(p.name)}</b>${p.star?`<span class="star" title="${esc((p.reasons||[]).join("; "))}">${ic("starFill",12)}</span>`:""}${starBtn}</td>
      <td class="num">${p.rating}</td>
      <td class="num">${p.played?(p.won+"–"+(p.drawn||0)+"–"+p.lost):"—"}</td>
      <td class="num">${p.played?(p.winPct+"%"):"—"}</td>
      <td class="num">${p.played?((p.diff>0?"+":"")+p.diff):"—"}</td>
      <td class="num">${p.titles||0}</td>
      <td class="num"><span class="form-dots">${(p.form||[]).map(f=>`<span class="fdot ${f==="W"?"w":"l"}" title="${f==="W"?"win":"loss"}"></span>`).join("")}</span></td>
    </tr>`;
  }).join("");
  return `
  <div class="legend">${ic("star",14)} <b>Star teams</b> — earned by record or set by hand (tap the star).</div>
  <div class="sheet-scroll"><table class="sheet">
    <thead><tr>
      <th class="num">#</th>
      ${th("name","Team")}
      ${th("rating","Rating","num")}
      ${th("won","W–D–L","num")}
      ${th("winPct","Win%","num")}
      ${th("rating","+/-","num")}
      ${th("titles","Titles","num")}
      <th class="num">Form</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function toggleStarAt(i){
  const p=SEASON_ROWS[i];
  if(!p) return;
  sendAction("seasonStar", {name:p.name});
}

function historyHTML(){
  if(!SEASON.tournaments || !SEASON.tournaments.length) return "";
  const items=SEASON.tournaments.map((t,i)=>{
    const d=t.date?new Date(t.date).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
    const champ=t.champion?esc(t.champion):"no champion";
    const top=(t.ranking||[]).slice(0,3).map((n,j)=>`<div>${j+1}. ${esc(n)}${starHTML(n)}</div>`).join("");
    return `<details class="hist-item"${i===0?" open":""}>
      <summary>
        <span class="date">${esc(String(d))}</span>
        <span>${esc(t.name)}</span>
        <span class="status-chip ${t.status==="abandoned"?"abandoned":"complete"}">${t.status==="abandoned"?"abandoned":"complete"}</span>
        <span class="date">${ic("trophy",13)} ${champ}</span>
      </summary>
      <div class="body">
        ${top?`<b>Final order</b><br>${top}`:""}
        <div class="champ-line">${t.participants} entrants · ${t.matches} matches recorded${t.status==="abandoned"?" · not counted toward ratings":""}</div>
      </div>
    </details>`;
  }).join("");
  return `<div class="round-title" style="font-size:19px; margin-top:24px;">History — newest first</div>${items}`;
}

function seasonToolsHTML(){
  return `
  <div class="round-title" style="font-size:19px; margin-top:24px;">Season tools</div>
  <div class="admin-tools">
    <button class="btn small secondary" onclick="exportSeason()">${ic("download",14)} Export season data</button>
    <button class="btn small secondary" onclick="document.getElementById('seasonFile').click()">${ic("upload",14)} Import season data</button>
    <button class="btn small danger" onclick="newSeasonDialog()">${ic("refresh",14)} Start a new season</button>
    <input type="file" id="seasonFile" accept=".json,application/json" style="display:none" onchange="importSeasonFile(this)">
  </div>
  <div class="round-title" style="font-size:19px; margin-top:24px;">Tournament tools</div>
  <div class="admin-tools">
    <button class="btn small secondary" onclick="exportState()">${ic("download",14)} Download tournament (.json)</button>
    <button class="btn small secondary" onclick="document.getElementById('stateFile').click()">${ic("upload",14)} Load tournament file</button>
    <input type="file" id="stateFile" accept=".json,application/json" style="display:none" onchange="importStateFile(this)">
  </div>`;
}

/* ---- state export / import ---- */
function exportState(){ sendAction("stateFull", {}); }
function downloadStateFile(text){
  if(!text){ toast("Nothing to download yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="football-tournament.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Tournament state downloaded.","info");
}
function importStateFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    if(!confirm("Load this tournament file? It replaces the tournament that's currently running.")){
      input.value=""; return;
    }
    sendAction("stateImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}

/* Network layer — every user action is a message to the server. */

let ws;
function connect(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // a Spectator tab announces itself (?viewer=1) so the server never
  // hands it the admin seat; a token-holding tab re-authenticates instead
  let spectating = false;
  try {
    spectating = localStorage.getItem("fbViewer")==="1" &&
                 !sessionStorage.getItem("fbAdminToken");
  } catch(_) {}
  ws = new WebSocket(proto + "//" + location.host + "/football/" + (spectating ? "?viewer=1" : ""));

  ws.addEventListener("message", (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); }
    catch (_) { return; } // a torn frame never blanks the sheet
    if(msg.type==="welcome"){
      MY_ROLE = msg.role;
      S = msg.state;
      CONNECTION_LOST = false;   // the line is back
      RETRY_DELAY = 1500;
      SEASON = msg.season || null;
      PLAYERS_DB = Array.isArray(msg.players) ? msg.players : [];
      if(msg.fullSeason) storeBackup(msg.fullSeason);
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      LAST_EVENT_FP = null; // don't replay old decisions as toasts
      LAST_SEED = S ? S.seed : null;
      // silent re-login (token lives in sessionStorage, dies with the tab)
      if(AUTH_REQUIRED && MY_ROLE==="guest"){
        let tok=null; try{ tok=sessionStorage.getItem("fbAdminToken"); }catch(_){}
        if(tok){ PENDING_TOKEN=tok; AUTO_LOGIN=true; sendAction("auth", {token: tok}); }
      }
      syncEventToasts();
      render();
    } else if(msg.type==="state"){
      S = msg.state;
      SEASON = msg.season || null;
      if(Array.isArray(msg.players)) PLAYERS_DB = msg.players;
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      if(msg.authRequired!=null) AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      if(LAST_SEED!=null && S && S.seed!==LAST_SEED && S.step!=="roster" && !S.suspended){
        toast("Tournament state loaded.","info");
      }
      if(S) LAST_SEED = S.seed;
      settleOpenForm();  // v1.8 — a rejected sheet keeps its draft
      syncEventToasts();
      syncImportToast();
      render();
    } else if(msg.type==="authOk"){
      MY_ROLE = "admin";
      if(PENDING_TOKEN){
        try{ sessionStorage.setItem("fbAdminToken", PENDING_TOKEN); localStorage.removeItem("fbViewer"); }catch(_){}
        PENDING_TOKEN = "";
        if(!msg.already && !AUTO_LOGIN) toast("Signed in — you're the admin now.","info");
      }
      AUTO_LOGIN = false;
      render();
    } else if(msg.type==="authFail"){
      PENDING_TOKEN = "";
      AUTO_LOGIN = false;
      try{ sessionStorage.removeItem("fbAdminToken"); }catch(_){}
      toast(msg.message || "That token isn't right.", "error");
      render();
    } else if(msg.type==="error"){
      toast(msg.message, "error");
    } else if(msg.type==="seasonFull"){
      downloadSeasonFile(msg.text);
    } else if(msg.type==="stateFull"){
      downloadStateFile(msg.text);
    } else if(msg.type==="sessionEnded"){
      SESSION_ENDED = true;
      render();
    }
  });

  ws.addEventListener("close", () => {
    if(!SESSION_ENDED){
      // v1.7: a dropped line no longer blanks the whole sheet — the
      // last state stays on screen under a reconnect banner, and the
      // retry backs off (1.5s → 15s) so a cold server isn't hammered
      CONNECTION_LOST = true;
      render();
      setTimeout(connect, RETRY_DELAY);
      RETRY_DELAY = Math.min(15000, Math.round(RETRY_DELAY * 1.6));
    }
  });
}
if(!GATED) connect();

function sendAction(type, payload){
  if(ws.readyState!==ws.OPEN) return;
  ws.send(JSON.stringify({type, payload}));
}

/* ---- action senders ---- */

function submitRoster(){
  const rawEl=document.getElementById("directivesInput");
  const raw=rawEl?rawEl.value:"";
  const nameEl=document.getElementById("tnameInput");
  const num=id=>{
    const el=document.getElementById(id);
    const v=el?parseInt(el.value,10):NaN;
    return Number.isFinite(v)?v:null;
  };
  sendAction("submitRoster", {raw, name:nameEl?nameEl.value:null,
    duration:num("durationInput"), breakMins:num("breakInput")});
}
function addTeam(){
  const v=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const payload={teamName:v("teamNameInput"), captain:v("captainInput"), players:v("playersInput")};
  if(!payload.teamName.trim()){ toast("Enter a team name.","error"); return; }
  if(!payload.captain.trim()){ toast("Enter the captain's name.","error"); return; }
  sendAction("addTeam", payload);
  ["teamNameInput","captainInput","playersInput"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
}
function removeTeam(index){ sendAction("removeTeam", {index}); }
function pickMode(mode){ sendAction("pickMode", {mode}); }
function addForbidden(){
  const x=document.getElementById("fx").value, y=document.getElementById("fy").value;
  sendAction("addForbidden", {x,y});
}
function removeForbidden(i){ sendAction("removeForbidden", {index:i}); }
function formTeams(){ sendAction("formTeams", {}); }
function goToPairing(){ sendAction("goToPairing", {}); }
function confirmTeamsAndDraw(){ sendAction("confirmTeamsAndDraw", {}); }
function saveScore(mi, sa, sb, penA, penB){ sendAction("saveScore", {mi, sa, sb, penA, penB}); }
function continueTournament(){ sendAction("continueTournament", {}); }
function undoLastScore(){ sendAction("undoScore", {}); }
function chooseStageManually(){ sendAction("chooseStage", {}); }
function doReset(){ sendAction("reset", {}); }

/* ---- season actions ---- */

function exportSeason(){ sendAction("seasonFull", {}); }
function downloadSeasonFile(text){
  if(!text){ toast("Nothing to export yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="football-season.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  storeBackup(text);
  toast("Season data downloaded — keep it somewhere safe.","info");
}
function importSeasonFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
    sendAction("seasonImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}
function newSeasonDialog(){
  const name=prompt("Name the new season (leave blank for the default):","");
  if(name===null) return;
  if(!confirm("Start a fresh season? The current archive stays on file until overwritten — export it first if you want to keep a copy.")) return;
  sendAction("seasonNew", {name});
}
function restoreBackup(){
  if(!BACKUP) return;
  IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
  sendAction("seasonImport", {text:BACKUP});
}
function toggleStar(name){ sendAction("seasonStar", {name}); }
function sortSeason(key){
  if(SEASON_SORT.key===key) SEASON_SORT.dir=-SEASON_SORT.dir;
  else SEASON_SORT={key, dir:-1};
  render();
}

if(!GATED) render();
</script>
