  <table class="sheet">
    <thead><tr>
      <th class="num">#</th>
      ${th("name","Player")}
      ${th("rating","Rating","num")}
      ${th("won","W–L","num")}
      ${th("winPct","Win%","num")}
      ${th("rating","+/-","num")}
      ${th("titles","Titles","num")}
      <th class="num">Form</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
function toggleStarAt(i){
  const p=SEASON_ROWS[i];
  if(!p) return;
  sendAction("seasonStar", {name:p.name});
}

function historyHTML(){
  if(!SEASON.tournaments || !SEASON.tournaments.length) return "";
  const items=SEASON.tournaments.map((t,i)=>{
    const d=t.date?new Date(t.date).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
    const champ=t.champion?esc(t.champion):"no champion";
    const top=(t.ranking||[]).slice(0,3).map((n,j)=>`<div>${j+1}. ${esc(n)}${starHTML(n)}</div>`).join("");
    return `<details class="hist-item"${i===0?" open":""}>
      <summary>
        <span class="date">${esc(String(d))}</span>
        <span>${esc(t.name)}</span>
        <span class="status-chip ${t.status==="abandoned"?"abandoned":"complete"}">${t.status==="abandoned"?"abandoned":"complete"}</span>
        <span class="date">🏆 ${champ}</span>
      </summary>
      <div class="body">
        ${top?`<b>Final order</b><br>${top}`:""}
        <div class="champ-line">${t.participants} entrants · ${t.matches} matches recorded${t.status==="abandoned"?" · not counted toward ratings":""}</div>
      </div>
    </details>`;
  }).join("");
  return `<div class="round-title" style="font-size:19px; margin-top:24px;">History — newest first</div>${items}`;
}

function seasonToolsHTML(){
  return `
  <div class="round-title" style="font-size:19px; margin-top:24px;">Season tools</div>
  <div class="admin-tools">
    <button class="btn small secondary" onclick="exportSeason()">⬇️ Export season data</button>
    <button class="btn small secondary" onclick="document.getElementById('seasonFile').click()">⬆️ Import season data</button>
    <button class="btn small danger" onclick="newSeasonDialog()">🔄 Start a new season</button>
    <input type="file" id="seasonFile" accept=".json,application/json" style="display:none" onchange="importSeasonFile(this)">
  </div>
  <div class="round-title" style="font-size:19px; margin-top:24px;">Tournament tools</div>
  <div class="admin-tools">
    <button class="btn small secondary" onclick="exportState()">⬇️ Download tournament (.json)</button>
    <button class="btn small secondary" onclick="document.getElementById('stateFile').click()">⬆️ Load tournament file</button>
    <input type="file" id="stateFile" accept=".json,application/json" style="display:none" onchange="importStateFile(this)">
  </div>`;
}

/* ---- state export / import ---- */
function exportState(){ sendAction("stateFull", {}); }
function downloadStateFile(text){
  if(!text){ toast("Nothing to download yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="table-tennis-tournament.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Tournament state downloaded.","info");
}
function importStateFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    if(!confirm("Load this tournament file? It replaces the tournament that's currently running.")){
      input.value=""; return;
    }
    sendAction("stateImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}

/* Network layer — every user action is a message to the server. */

let ws;
function connect(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // a Spectator tab announces itself (?viewer=1) so the server never
  // hands it the admin seat; a token-holding tab re-authenticates instead
  let spectating = false;
  try {
    spectating = localStorage.getItem("ttViewer")==="1" &&
                 !sessionStorage.getItem("ttAdminToken");
  } catch(_) {}
  ws = new WebSocket(proto + "//" + location.host + "/table-tennis/" + (spectating ? "?viewer=1" : ""));

  ws.addEventListener("message", (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type==="welcome"){
      MY_ROLE = msg.role;
      S = msg.state;
      SEASON = msg.season || null;
      if(msg.fullSeason) storeBackup(msg.fullSeason);
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      LAST_EVENT_FP = null; // don't replay old decisions as toasts
      LAST_SEED = S ? S.seed : null;
      // silent re-login (token lives in sessionStorage, dies with the tab)
      if(AUTH_REQUIRED && MY_ROLE==="guest"){
        let tok=null; try{ tok=sessionStorage.getItem("ttAdminToken"); }catch(_){}
        if(tok){ PENDING_TOKEN=tok; AUTO_LOGIN=true; sendAction("auth", {token: tok}); }
      }
      syncEventToasts();
      render();
    } else if(msg.type==="state"){
      S = msg.state;
      SEASON = msg.season || null;
      GUEST_COUNT = msg.guestCount;
      HAS_ADMIN = msg.hasAdmin;
      if(msg.authRequired!=null) AUTH_REQUIRED = !!msg.authRequired;
      LIVE_VIDEO = msg.liveVideo || null;
      if(LAST_SEED!=null && S && S.seed!==LAST_SEED && S.step!=="roster" && !S.suspended){
        toast("Tournament state loaded.","info");
      }
      if(S) LAST_SEED = S.seed;
      syncEventToasts();
      syncImportToast();
      render();
    } else if(msg.type==="authOk"){
      MY_ROLE = "admin";
      if(PENDING_TOKEN){
        try{ sessionStorage.setItem("ttAdminToken", PENDING_TOKEN); localStorage.removeItem("ttViewer"); }catch(_){}
        PENDING_TOKEN = "";
        if(!msg.already && !AUTO_LOGIN) toast("Signed in — you're the admin now.","info");
      }
      AUTO_LOGIN = false;
      render();
    } else if(msg.type==="authFail"){
      PENDING_TOKEN = "";
      AUTO_LOGIN = false;
      try{ sessionStorage.removeItem("ttAdminToken"); }catch(_){}
      toast(msg.message || "That token isn't right.", "error");
      render();
    } else if(msg.type==="error"){
      toast(msg.message, "error");
    } else if(msg.type==="seasonFull"){
      downloadSeasonFile(msg.text);
    } else if(msg.type==="stateFull"){
      downloadStateFile(msg.text);
    } else if(msg.type==="sessionEnded"){
      SESSION_ENDED = true;
      render();
    }
  });

  ws.addEventListener("close", () => {
    if(!SESSION_ENDED){
      S = null;
      render();
      setTimeout(connect, 1500); // simple auto-retry
    }
  });
}
if(!GATED) connect();

function sendAction(type, payload){
  if(ws.readyState!==ws.OPEN) return;
  ws.send(JSON.stringify({type, payload}));
}

/* ---- action senders ---- */

function submitRoster(){
  const raw=document.getElementById("namesInput").value;
  const nameEl=document.getElementById("tnameInput");
  const ptsEl=document.getElementById("pointsInput");
  let points=null;
  if(ptsEl){
    const v=parseInt(ptsEl.value,10);
    points=Number.isFinite(v)?v:null;
  }
  sendAction("submitRoster", {raw, name:nameEl?nameEl.value:null, points});
}
function pickMode(mode){ sendAction("pickMode", {mode}); }
function addForbidden(){
  const x=document.getElementById("fx").value, y=document.getElementById("fy").value;
  sendAction("addForbidden", {x,y});
}
function removeForbidden(i){ sendAction("removeForbidden", {index:i}); }
function formTeams(){ sendAction("formTeams", {}); }
function goToPairing(){ sendAction("goToPairing", {}); }
function confirmTeamsAndDraw(){ sendAction("confirmTeamsAndDraw", {}); }
function saveScore(mi, sa, sb){ sendAction("saveScore", {mi, sa, sb}); }
function continueTournament(){ sendAction("continueTournament", {}); }
function undoLastScore(){ sendAction("undoScore", {}); }
function chooseStageManually(){ sendAction("chooseStage", {}); }
function doReset(){ sendAction("reset", {}); }

/* ---- season actions ---- */

function exportSeason(){ sendAction("seasonFull", {}); }
function downloadSeasonFile(text){
  if(!text){ toast("Nothing to export yet.","error"); return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="table-tennis-season.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  storeBackup(text);
  toast("Season data downloaded — keep it somewhere safe.","info");
}
function importSeasonFile(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
    sendAction("seasonImport", {text:String(reader.result||"")});
    input.value="";
  };
  reader.readAsText(file);
}
function newSeasonDialog(){
  const name=prompt("Name the new season (leave blank for the default):","");
  if(name===null) return;
  if(!confirm("Start a fresh season? The current archive stays on file until overwritten — export it first if you want to keep a copy.")) return;
  sendAction("seasonNew", {name});
}
function restoreBackup(){
  if(!BACKUP) return;
  IMPORT_MARK=SEASON?SEASON.tournamentCount:0;
  sendAction("seasonImport", {text:BACKUP});
}
function toggleStar(name){ sendAction("seasonStar", {name}); }
function sortSeason(key){
  if(SEASON_SORT.key===key) SEASON_SORT.dir=-SEASON_SORT.dir;
  else SEASON_SORT={key, dir:-1};
  render();
}

if(!GATED) render();
</script>
